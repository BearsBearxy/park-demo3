# CI:后端 mvn verify(Testcontainers 起真 MySQL 跑 240+ IT) + 前端 typecheck/vitest/build。
# 只管测试。镜像构建与发布在 deploy.yml:master 上本工作流全绿后由它接手(2026-10-03 拆开,用户要求)。
# ⚠ 改本工作流的 name 要同步改 deploy.yml 的 workflow_run.workflows。
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test (Testcontainers MySQL)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 重型库懒加载门禁:exceljs(917KB)/echarts(678KB)只许 await import 拉起。谁在某个屏里
      # 写一句静态 import,它就被压进那个屏的首屏 chunk —— 总量没变、只是搬了家,构建产物上看不出来,
      # 只能在源码层拦。放在 build 前面:失败得快。
      # 放行三类:import type(编译期擦除,billNoticeExcel.ts:15 在用)、components/ana/echartsBundle.ts
      # (全站唯一 echarts 装配点,本身只被 AnaEChart.vue 动态 import)、tools/ 与 *.spec.ts(不进产物)。
      # 匹配 from 那一侧而不是 import 那一侧:echartsBundle.ts 里有跨行写法(`}` 换行才 from),
      # 盯 import 开头会漏掉;而动态 import('exceljs') 没有 from,天然不会误伤。
      - name: heavy-lib static import gate
        run: |
          hits=$(grep -rnE "from[[:space:]]*['\"](exceljs|echarts)|^[[:space:]]*import[[:space:]]*['\"](exceljs|echarts)" \
                   src --include='*.ts' --include='*.vue' \
                 | grep -vE "^src/tools/|\.spec\.ts:|import type|^src/components/ana/echartsBundle\.ts:") || true
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "静态 import 重型库不许:改成 await import(...),否则它会被打进这个屏的首屏 chunk。"
            echo "确需新增装配点?先说服自己它只被动态 import 拉起,再把它加进本步骤的放行名单。"
            exit 1
          fi
      # build 含 vue-tsc 类型门禁(tsconfig.app.json 实跑) + 令牌门禁 + 预压缩(包体预算 2026-09-18 按用户要求去掉)
      - run: npm run build
      - run: npm run test
