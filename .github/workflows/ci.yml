# CI:后端 mvn verify(Testcontainers 起真 MySQL 跑 240+ IT) + 前端 typecheck/vitest/build。
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test (Testcontainers MySQL)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # build 含 vue-tsc 类型门禁(tsconfig.app.json 实跑)
      - run: npm run build
      - run: npm run test

  # 镜像构建:在 runner 上编译并推 ghcr(2026-08-13 从服务器搬来)。
  # 2C4G 云主机跑 vue-tsc + maven 会内存耗尽(beta.1 部署第三败),runner 是 4C16G 且构建缓存免费。
  # 镜像随私有仓库私有;两个 tag:latest(compose 默认拉的) + 提交 sha(回滚锚点)。
  images:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # 推 ghcr 必需,GITHUB_TOKEN 默认只有 read
    steps:
      - uses: actions/checkout@v4
      # ghcr 镜像名必须全小写,而 owner 是 BearsBearxy —— 直接用 github.repository 会被拒
      - id: name
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.name.outputs.prefix }}-backend:latest
            ${{ steps.name.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.name.outputs.prefix }}-frontend:latest
            ${{ steps.name.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # CD:镜像就绪后发布。整树替换(保留 .env,数据卷不动)——源码仍然上传,不为构建,
  # 而是让服务器留一份可应急 --build 的底子 + compose/迁移文件与镜像同版本。
  # 上一版留 /opt/demo3.prev 可手工回滚(mv demo3.prev demo3 && docker compose up -d)。
  # 凭据:仓库 secrets DEPLOY_HOST / DEPLOY_SSH_KEY(专用部署密钥,公钥在服务器 authorized_keys)。
  deploy:
    needs: images
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read             # 服务器要用这个 token 登 ghcr 拉私有镜像,缺了 pull 会 denied
    concurrency: deploy          # 连续推送串行部署,避免互踩
    steps:
      - uses: actions/checkout@v4
      - name: Publish to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          tar --exclude=./.git -czf /tmp/demo3.tgz .
          scp -i ~/.ssh/deploy /tmp/demo3.tgz root@"$HOST":/opt/demo3.tgz
          # 脚本走 stdin(bash -s)而不是命令行:GITHUB_TOKEN 因此不进服务器的进程列表/history。
          # keepalive 留着:pull 大层 + Flyway 迁移(本轮 V45→V94 五十个)仍可静默数分钟。
          ssh -i ~/.ssh/deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              root@"$HOST" 'bash -s' <<'EOF'
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cd /opt && rm -rf demo3.staging && mkdir demo3.staging
            tar xzf demo3.tgz -C demo3.staging && rm demo3.tgz
            cp demo3/.env demo3.staging/.env
            rm -rf demo3.prev && mv demo3 demo3.prev && mv demo3.staging demo3
            cd demo3 && docker compose pull && docker compose up -d
            docker logout ghcr.io
            docker image prune -f          # 换版后的悬空层,2C4G 机器磁盘也不宽裕
          EOF
      - name: Health check (public)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$HOST/" || true)
            [ "$code" = "200" ] && echo "site healthy" && exit 0
            sleep 5
          done
          echo "site NOT healthy after deploy" && exit 1
