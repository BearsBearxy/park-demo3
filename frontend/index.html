<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory Park</title>
    <!-- 远程 webfont 已从 tokens.css 移除(境内不可达,一直走回退字体),故这里的 preconnect
         也一并删掉——没有后续请求要复用连接,预建连纯属浪费 DNS/TLS 往返 -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { width: 100%; height: 100%; overflow: hidden; }
      /* 横向放开:视口 < 960px 地板(fp-stage min-width)时 body 出横滚保内容不被切;≥960 无溢出自然无滚条。纵向仍由外壳内部卡片滚动。 */
      body { width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
