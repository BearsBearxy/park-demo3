# SPA 托管 + /api 反代(compose 内 backend 服务名解析)。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 客户端真实 IP(安全审计 F04):后端登录 / 提权限流按 ip|账号 分桶,IP 取 X-Forwarded-For 首段。
    # 原来 /api 用 $proxy_add_x_forwarded_for 追加 —— 客户端自己带的 XFF 留在首段,直连 nginx(明文部署、8081 被放行)
    # 时每次换一个 XFF 就换一个桶,5 次锁定形同虚设。现在只信 docker 内网(前面的 Caddy)给的 XFF,
    # 其余一律以 TCP 对端为准;下面 /api 再把 XFF 重写成这一个地址。
    # 172.16.0.0/12 是 docker 默认给 compose 网络分配的段;不信 192.168/16 —— 那多半是办公室 LAN,直连的同事能伪造。
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # 静态产物优先吐构建期压好的同名 .gz(scripts/precompress.mjs 生成,level 9),运行时零 CPU。
    # ⚠ gzip_static 是可继承指令,写在 server 级即对下面 /assets/ /fonts/ = /index.html 全部生效
    #   —— 和 add_header「子 location 写了就不继承父级」那个坑不是一回事,不用重复四遍。
    # ⚠ 它不看 gzip_min_length,小文件跳过是在生成脚本里把的。找不到 .gz 就自动回落到下面的运行时 gzip。
    gzip_static on;

    gzip on;
    # ⚠ nginx 默认 gzip_proxied off = 反代出去的响应一概不压缩。只写 gzip on 时
    #   静态文件压了、/api 的 JSON 一个字节没压(2026-08-18 审计实测:单包最大 629KB 裸传)。
    #   any = 无视上游 Cache-Control/Expires 一律压,后端本就发 no-store,不压才是纯亏。
    gzip_proxied any;
    gzip_min_length 1024;          # 比这小的包,gzip 头开销大过收益
    gzip_vary on;                  # 带 Vary: Accept-Encoding,避免中间缓存把压缩体喂给不支持的客户端
    gzip_types text/css application/javascript application/json image/svg+xml;

    # brotli 暂不启用(下面这两行是给将来用的,现在打开会直接 nginx: unknown directive):
    #   brotli_static on;
    #   brotli on;
    #   brotli_types text/css application/javascript application/json image/svg+xml;
    # 前提:官方 nginx 镜像编译进了 --with-http_gzip_static_module,但**不含** ngx_brotli,
    # 要用得换 fholzer/nginx-brotli 之类的第三方镜像或自编译。gzip 对 JS/JSON 已有 3~8 倍压缩比,
    # brotli 再省 15~20%,为这点收益换掉官方基础镜像(=自己接手安全更新)不划算。

    # 安全响应头:后端 Spring Security 只覆盖 /api,静态页面这层没人管,只能在这里下发。
    # always = 错误响应(4xx/5xx)也带上,否则报错页会成为没有防护的缺口。
    # CSP 口径:style-src 必须留 'unsafe-inline'(ds/ 组件与 index.html 内联样式大量存在);
    #   script-src 不需要 'unsafe-eval'(Vue 运行时编译未启用);
    #   font-src 无需单列,远程 webfont 已移除,字体走 default-src 'self'。
    # 暂不下发 Strict-Transport-Security:当前是明文 HTTP,HSTS 无意义且会给调试添堵;
    #   将来上 TLS(部署指南第 7 节)时补 add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # 第二道闸:即使将来有人把 vite 的 sourcemap 打开、.map 混进镜像,也一律不外泄。
    # (构建侧已 sourcemap:false;两道都留着,任一处被改回来都不会直接变成源码泄露)
    location ~ \.map$ { return 404; }

    # vue-router history 模式:未命中文件一律回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物永久缓存;index.html 不缓存(发布即生效)
    # ⚠ nginx 陷阱:子 location 只要自己写了 add_header,父级的全部 add_header 一概不继承。
    # 下面两个 location 各有 Cache-Control,所以安全头必须原样重复一遍,否则 JS/CSS 和首页
    # 反倒是全站唯一没有安全头的响应。改上面那组时这两处要同步改。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }
    # 自托管字体:public/ 下的文件不带构建 hash,靠文件名里的 -v1 做 cache busting,
    # 所以可以和 /assets/ 一样按 immutable 永久缓存(换字体必须同时改文件名)。
    # 安全头照例重复一遍——nginx 子 location 只要自己写了 add_header 就不继承父级的。
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    # 版本文件(vite 的 app-version 插件生成):页面靠轮询它发现「发新版了,请刷新」。
    # 缓存住它就等于这条提示永远不出,所以和 index.html 一样 no-cache;安全头照例重复一遍。
    location = /version.json {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    location /api/ {
        # 请求体上限这里不写 = nginx 默认 1m,登录这类不用登录就能调的接口照旧;只有导入接口放大,见本段末尾那个 location。
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 透传/回传链路 ID,配合后端 TraceIdFilter 排障
        proxy_set_header X-Trace-Id $http_x_trace_id;

        # 导入接口(2026-10-05 用户:「抄表整册导入被拒：超过 1MB 就被服务器挡掉，没有分批导入的办法」)。
        # 各导入(抄表、合同、台账、附表10…)都把整份文件拼成一个 JSON 一次 POST;后端的导入接口路径全以 /import 结尾
        #   (合同整份是 /import-full),新加的照这个命名就自动落到这里。
        # 请求体 16m:抄表一行约 300 字节(park_review 2024-02 实测:1,090 块表 = 322KB,单行最大 550 字节),默认 1m 只装得下 3 个多月;
        #   整年 12 个月约 3.8MB,留 4 倍。
        # 只放导入、不放整个 /api/(复查 F1):登录这类不用登录就能调的接口也放到 16m,一个匿名请求就能让后端 Jackson 把十几 MB 的字段
        #   整个读进内存、再被校验拒掉,比 1m 放大 16 倍;导入接口没登录时 Spring Security 先回 401,不读请求体。
        # 不设 0(不限):nginx 先把整个请求体收进临时文件再转给后端,匿名请求也一样,不限 = 谁都能往磁盘灌;
        #   后端 Jackson 把整个请求体一次解析进堆,上限就是每个请求能占的内存。
        # 其它几跳都不比这里小:Caddy reverse_proxy 默认不限请求体;compose 没把后端 8080 发布到宿主机;Tomcat 的 max-http-form-post-size
        #   只管表单;max-swallow-size(2MB)只管没读请求体就拒掉的请求,实测(Tomcat 10.1.60 经本配置)16MB 照样把 401 带回来。
        # 等后端回话 900s(nginx 默认 60s,复查 F2):抄表导入逐行认表、写档案,本机测试库实测 3 个月 3,270 行 117 秒、整年 13,080 行约 345 秒,
        #   默认 60s 连 3 个月都等不完。等过了点 nginx 先回 504,后端照样跑完提交 —— 失败卡按「没等到结果」说(importRun.failKind)。
        #   Caddy 默认不限等多久;前端 axios 没设超时。
        # proxy_set_header 不写 = 继承上面四行;proxy_pass 不继承,要再写一遍。
        location ~ ^/api/.+/import(-full)?$ {
            client_max_body_size 16m;
            proxy_read_timeout 900s;
            proxy_pass http://backend:8080;
        }
    }
}
