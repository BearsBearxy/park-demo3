# SPA 托管 + /api 反代(compose 内 backend 服务名解析)。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态产物优先吐构建期压好的同名 .gz(scripts/precompress.mjs 生成,level 9),运行时零 CPU。
    # ⚠ gzip_static 是可继承指令,写在 server 级即对下面 /assets/ /fonts/ = /index.html 全部生效
    #   —— 和 add_header「子 location 写了就不继承父级」那个坑不是一回事,不用重复四遍。
    # ⚠ 它不看 gzip_min_length,小文件跳过是在生成脚本里把的。找不到 .gz 就自动回落到下面的运行时 gzip。
    gzip_static on;

    gzip on;
    # ⚠ nginx 默认 gzip_proxied off = 反代出去的响应一概不压缩。只写 gzip on 时
    #   静态文件压了、/api 的 JSON 一个字节没压(2026-08-18 审计实测:单包最大 629KB 裸传)。
    #   any = 无视上游 Cache-Control/Expires 一律压,后端本就发 no-store,不压才是纯亏。
    gzip_proxied any;
    gzip_min_length 1024;          # 比这小的包,gzip 头开销大过收益
    gzip_vary on;                  # 带 Vary: Accept-Encoding,避免中间缓存把压缩体喂给不支持的客户端
    gzip_types text/css application/javascript application/json image/svg+xml;

    # brotli 暂不启用(下面这两行是给将来用的,现在打开会直接 nginx: unknown directive):
    #   brotli_static on;
    #   brotli on;
    #   brotli_types text/css application/javascript application/json image/svg+xml;
    # 前提:官方 nginx 镜像编译进了 --with-http_gzip_static_module,但**不含** ngx_brotli,
    # 要用得换 fholzer/nginx-brotli 之类的第三方镜像或自编译。gzip 对 JS/JSON 已有 3~8 倍压缩比,
    # brotli 再省 15~20%,为这点收益换掉官方基础镜像(=自己接手安全更新)不划算。

    # 安全响应头:后端 Spring Security 只覆盖 /api,静态页面这层没人管,只能在这里下发。
    # always = 错误响应(4xx/5xx)也带上,否则报错页会成为没有防护的缺口。
    # CSP 口径:style-src 必须留 'unsafe-inline'(ds/ 组件与 index.html 内联样式大量存在);
    #   script-src 不需要 'unsafe-eval'(Vue 运行时编译未启用);
    #   font-src 无需单列,远程 webfont 已移除,字体走 default-src 'self'。
    # 暂不下发 Strict-Transport-Security:当前是明文 HTTP,HSTS 无意义且会给调试添堵;
    #   将来上 TLS(部署指南第 7 节)时补 add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # 第二道闸:即使将来有人把 vite 的 sourcemap 打开、.map 混进镜像,也一律不外泄。
    # (构建侧已 sourcemap:false;两道都留着,任一处被改回来都不会直接变成源码泄露)
    location ~ \.map$ { return 404; }

    # vue-router history 模式:未命中文件一律回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物永久缓存;index.html 不缓存(发布即生效)
    # ⚠ nginx 陷阱:子 location 只要自己写了 add_header,父级的全部 add_header 一概不继承。
    # 下面两个 location 各有 Cache-Control,所以安全头必须原样重复一遍,否则 JS/CSS 和首页
    # 反倒是全站唯一没有安全头的响应。改上面那组时这两处要同步改。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }
    # 自托管字体:public/ 下的文件不带构建 hash,靠文件名里的 -v1 做 cache busting,
    # 所以可以和 /assets/ 一样按 immutable 永久缓存(换字体必须同时改文件名)。
    # 安全头照例重复一遍——nginx 子 location 只要自己写了 add_header 就不继承父级的。
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 透传/回传链路 ID,配合后端 TraceIdFilter 排障
        proxy_set_header X-Trace-Id $http_x_trace_id;
    }
}
