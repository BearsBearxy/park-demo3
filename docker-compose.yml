# 部署:先 bash deploy/gen-env.sh <公网IP或域名> 生成 .env,再 docker compose up -d --build → http://<host>:${WEB_PORT:-8081}
# 三件套:mysql(健康检查) + backend(Flyway 建表+种子,依赖 db 健康) + frontend(nginx 静态 + /api 反代)。
# 环境变量见 .env.example。安全关键项一律用 ${VAR:?...} 无兜底(fail-closed):缺哪项就在 up 阶段
# 报错退出,而不是静默用仓库里公开的 JWT 密钥 + 种子口令 admin/admin123 起一个"谁都能登且可写"的实例
# ——端口一旦对公网开放,弱默认等同无认证。本机演示走同一条路,一行:
#   bash deploy/gen-env.sh localhost   (随机口令;端口占用就改生成的 .env 里 WEB_PORT)
#
# backend/frontend 同时给 image 与 build(2026-08-13):
#   服务器  docker compose pull && up -d       → 拉 CI 构建好的镜像,机器上不编译
#   本地/应急 docker compose up -d --build     → 照旧本地构建,产物打成同名 tag
# 起因:2C4G 的云主机跑 vue-tsc + maven 会内存耗尽(v0.10.0-beta.1 部署实测),
# 构建挪到 GitHub runner 后服务器只负责跑。镜像在 ghcr 上随私有仓库私有,拉取需 docker login。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?未设置 DB_PASSWORD。请先运行 bash deploy/gen-env.sh <公网IP或域名> 生成 .env}
      MYSQL_DATABASE: park_demo3
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 走 127.0.0.1(TCP)而非 localhost(socket):首次初始化的临时实例只开 socket,
      # socket ping 会在 3306 未监听时误报 healthy(实测误报窗口约 1 分钟);
      # mysqladmin ping 在 Access denied 时也返回 0,故用真实凭据 SELECT 1 验证
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    # 仅 compose 内网可达;需宿主机直连调库时自行加 ports(如 "13307:3306",避开 dev 的 13306)

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/bearsbearxy/park-demo3}-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped   # 服务器重启/OOM 后自愈;重启竞速(mysql 未就绪)由重试循环兜住
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?未设置 DB_PASSWORD。请先运行 bash deploy/gen-env.sh <公网IP或域名> 生成 .env}
      # 默认档位 prod 而非 dev:忘配 profile 时走严格档(关 swagger/api-docs),弱档必须显式声明
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET: ${JWT_SECRET:?未设置 JWT_SECRET。请先运行 bash deploy/gen-env.sh <公网IP或域名> 生成 .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?未设置 ADMIN_PASSWORD。仓库种子口令 admin/admin123 众所周知,必须覆盖}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}   # 非空=创建只读账号 viewer(GET-only);留空则功能关闭(唯一可选项)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?未设置 CORS_ALLOWED_ORIGINS(前端域名白名单,如 http://1.2.3.4)}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/bearsbearxy/park-demo3}-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
