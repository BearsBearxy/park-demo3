# 一键部署:docker compose up -d --build → http://localhost:${WEB_PORT:-8081}
# 三件套:mysql(健康检查) + backend(Flyway 建表+种子,依赖 db 健康) + frontend(nginx 静态 + /api 反代)。
# 环境变量见 .env.example;不建 .env 时按 dev 默认起(admin/admin123,勿用于公网)。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: park_demo3
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    # 仅 compose 内网可达;需宿主机直连调库时自行加 ports(如 "13307:3306",避开 dev 的 13306)

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32+chars}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
