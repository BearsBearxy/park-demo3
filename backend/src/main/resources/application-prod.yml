spring:
  datasource:
    password: ${DB_PASSWORD}     # prod 必须由环境提供，去除 root 默认回退

app:
  jwt:
    secret: ${JWT_SECRET}        # prod 必须由环境提供，缺失即 fail-fast（JwtUtil 校验）
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}   # prod 必须给前端域名白名单，缺失即 fail-fast
  admin:
    password: ${ADMIN_PASSWORD}  # prod 必须由环境提供，启动时重置 admin 口令（消除 admin/admin123 默认）
  viewer:
    password: ${VIEWER_PASSWORD:}  # prod 可选：非空才创建只读账号 viewer；留空=功能关闭（不引入弱口令默认）

# 生产收紧可观测面与 API 文档暴露
management:
  endpoints:
    web:
      exposure:
        # health(匿名可达，只回 UP/DOWN) + metrics(排障要看 http.server.requests 分位数)。
        # metrics 并非匿名开放：SecurityConfig 里 /actuator/** 的 GET 要求已登录、非 GET 要 ADMIN，
        # 只有 /actuator/health 在 permitAll 名单里——加 metrics 不动这条口径。
        # 仍不放 prometheus/info：前者无抓取端，后者会漏构建信息。
        include: health,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false             # 关闭 OpenAPI/Swagger，避免公网暴露完整接口地图
  swagger-ui:
    enabled: false
