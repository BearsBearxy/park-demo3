server:
  port: 8080
spring:
  application:
    name: demo3-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:park_demo3}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32+chars}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}   # dev 全开；prod 必须设为前端域名白名单（逗号分隔）
  admin:
    password: ${ADMIN_PASSWORD:}                 # 留空=保留种子默认(仅 dev)；设置则启动时重置 admin 口令
  viewer:
    password: ${VIEWER_PASSWORD:viewer123}       # 只读账号(viewer/GET-only);dev 默认 viewer123,置空=不创建
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized   # 匿名探针只见 UP/DOWN；DB/磁盘等组件细节仅认证后可见
logging:
  level:
    com.park.demo3: INFO
