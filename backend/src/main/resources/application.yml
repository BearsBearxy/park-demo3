server:
  port: 8080
spring:
  application:
    name: demo3-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # rewriteBatchedStatements=true:MySQL 驱动默认把 addBatch/executeBatch 拆成逐条往返,
    # 不加则任何批量写(Flyway V35 的 executeBatch、后续批量导入)都白批;跨网 1~2ms/条时差距是数量级的
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:park_demo3}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    # dev 默认见 application-dev.yml；此处无兜底，非 dev profile 缺环境变量即 fail-fast
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    # 两条迁移链(2026-10-04 用户拍板:产品卖给别的园区,每园一个库;我园生产照旧,不用设任何变量):
    #   默认 = 老链 db/migration(V1–V137,混着我园数据,已冻结)+ db/common(V138 起,两条链共用)
    #   新园区部署设 FLYWAY_LOCATIONS=classpath:db/baseline,classpath:db/common —— 空库起步,只有表结构 + 通用行
    #   见 db/common/README.md、deploy/README-部署指南.md「新园区上线」;MigrationLayoutTest 钉着这个默认值
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/common}
    baseline-on-migrate: false
  servlet:
    multipart:
      # 全站没有文件上传端点(各导入都收 JSON)。开着的话 DispatcherServlet 会在找处理器之前就让 Tomcat
      # 把 multipart 请求拆段解析 —— 匿名打登录口就能耗线程、刷临时文件(安全审计 G2a,另见 pom 的 tomcat.version)
      enabled: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt:
    # dev 默认见 application-dev.yml；此处无兜底，非 dev profile 缺环境变量即 fail-fast
    secret: ${JWT_SECRET}
    # 无吊销机制（登出只是前端丢 token，签发出去的 JWT 到期前一直有效），故把暴露窗口从 720(12h) 收到 120(2h)；
    # 运维仍可用 JWT_EXPIRE_MINUTES 覆盖
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  cors:
    # dev 默认见 application-dev.yml；此处无兜底，非 dev profile 缺环境变量即 fail-fast（prod 须给前端域名白名单，逗号分隔）
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  flyway:
    # 空库遇到老链(混着我园数据)就拒绝启动,见 config/FlywayChainGuard(2026-10-04 用户拍板每园一个库)。
    # 新园区漏写 FLYWAY_LOCATIONS 时靠它拦住;确实要在空库上重建我园,显式设 FLYWAY_ALLOW_LEGACY_ON_EMPTY=true
    allow-legacy-on-empty: ${FLYWAY_ALLOW_LEGACY_ON_EMPTY:false}
  admin:
    password: ${ADMIN_PASSWORD:}                 # 留空=保留种子默认(仅 dev)；设置且 admin 仍是种子口令时改成它，改过之后不再覆盖
  viewer:
    # 只读账号(viewer/GET-only)：留空=不创建，与 prod 一致；dev 默认见 application-dev.yml
    password: ${VIEWER_PASSWORD:}
  # 部署开关(2026-10-05 用户拍板「按你建议修改」,见 config/DeployConfig):默认值就是我园生产,不用设。
  # 客户园区由 deploy/gen-env.sh 写 PARK_TOOLS_ENABLED=false(关三处模拟填充与损益附表自动补行)、
  # RELEASE_BASELINE=装机那一版(更新记录只给看之后的)
  park-tools:
    enabled: ${PARK_TOOLS_ENABLED:true}
  release-baseline: ${RELEASE_BASELINE:0.0.0}
  # SlowRequestFilter 的 warn 阈值(ms)。正常请求 2ms 级、最重的聚合接口 200ms 上下，
  # 取 500 是「已经不像正常了」的线；线上想收紧临时改环境变量即可，不必重打包
  slow-request-ms: ${SLOW_REQUEST_MS:500}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized   # 匿名探针只见 UP/DOWN；DB/磁盘等组件细节仅认证后可见
  metrics:
    distribution:
      # http.server.requests 默认只有 count/sum/max，看不出分布——p95 被均值抹平正是慢请求藏身处。
      # 开直方图后 /actuator/metrics 才能给出分位数；SLO 桶按「体感分级」取：
      # 200ms 内=顺滑，500ms=SlowRequestFilter 的告警线，1s/3s=用户已在等
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 200ms,500ms,1s,3s
logging:
  level:
    com.park.demo3: INFO
  # TraceIdFilter 已把 traceId 写进 MDC 并回响应头 X-Trace-Id，但 pattern 里没打出来，
  # 用户报上来的 traceId 在日志里搜不到，整条链路白建 —— 故显式加 %X{traceId}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
